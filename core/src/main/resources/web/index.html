<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeamBridge</title>
<meta name="theme-color" content="#4f46c8">
<style>
:root{/* M3 baseline tokens (surface containers, primary/secondary roles) */
--bg:#fef7ff;--s1:#fff;--s2:#f3edf7;--s3:#e6e0e9;--on:#1d1b20;--mut:#49454f;--pri:#6750a4;--onpri:#fff;--ton:#eaddff;--onton:#21005d;--sec:#e8def8;--onsec:#1d192b;--outl:#79747e;
--ok:#1f7a47;--err:#ba1a1a;--errc:#ffdad6;--r:28px;--sh:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#141218;--s1:#1d1b20;--s2:#211f26;--s3:#2b2930;--on:#e6e0e9;--mut:#cac4d0;--pri:#d0bcff;--onpri:#381e72;--ton:#4f378b;--onton:#eaddff;--sec:#4a4458;--onsec:#e8def8;--outl:#938f99;--ok:#7bd99b;--err:#ffb4ab;--errc:#93000a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Google Sans",Roboto,sans-serif;background:var(--bg);color:var(--on)}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:calc(12px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 12px calc(20px + env(safe-area-inset-left));background:var(--bg)}
#conn{font:12px ui-monospace,monospace;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;width:100%;order:3}
#conn span{background:var(--s2);border-radius:8px;padding:3px 8px;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:12px}
.bar{gap:8px;margin-bottom:12px;flex-wrap:wrap} .mini{display:flex;align-items:center;gap:6px} .mini select{width:auto;padding:8px 10px;border-radius:12px}
.tip{display:flex;gap:10px;align-items:center;margin:16px auto 0;max-width:440px;background:var(--sec);color:var(--onsec);border-radius:16px;padding:10px 12px;font-size:13px}
/* free-form remote grid */
.g{--gap:10px;--cell:calc((min(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right),440px) - (var(--cols) - 1)*var(--gap))/var(--cols));
 width:min(100%,440px);margin:0 auto;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),var(--cell));gap:var(--gap);position:relative;touch-action:pan-y}
.g .tile{position:relative;min-width:0;min-height:0;display:flex;align-items:stretch;justify-content:stretch;z-index:1}
.g .tile>*{flex:1;width:100%;height:100%}
.g .cell{border:1.5px dashed var(--s3);border-radius:16px;z-index:0}
.g .k{width:100%;height:100%}
.g .k.wide{border-radius:24px}
.g.edit .tile{animation:wig .28s ease-in-out infinite alternate;cursor:grab;touch-action:none}
.g.edit .tile>*{pointer-events:none}
.g.edit .tile.drag{animation:none;z-index:5;cursor:grabbing;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.g .rz{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--onpri);font-size:12px;display:grid;place-items:center;z-index:2;pointer-events:auto!important;cursor:nwse-resize}
@keyframes wig{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
.k.sending{outline:3px solid var(--outl)} .k.sent,.okb.sent,.d.sent{outline:3px solid var(--pri);outline-offset:2px} .k.fail,.d.fail,.okb.fail{outline:3px solid var(--err)}
.dpad{position:relative;width:auto!important;height:100%!important;aspect-ratio:1;margin:0 auto;border-radius:50%;background:color-mix(in srgb,var(--ton) 60%,transparent);border:2px solid var(--ton)}
.dpad .d{position:absolute;width:31%!important;height:31%!important;font-size:clamp(16px,5vw,28px)} .dpad .u{left:34.5%!important;top:2%!important} .dpad .dn{left:34.5%!important;bottom:2%!important;top:auto!important} .dpad .l{left:2%!important;top:34.5%!important} .dpad .r{right:2%!important;left:auto!important;top:34.5%!important}
.dpad .okb{left:31%!important;top:31%!important;width:38%!important;height:38%!important;background:var(--pri)!important;color:var(--onpri)!important}
.g .rock{height:100%}
.search{max-width:440px;margin:0 0 16px}
pre.code{background:var(--s2);border-radius:12px;padding:12px;overflow:auto;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;margin:0}
header h1{font-size:24px;margin:0;flex:1;letter-spacing:-.4px}
.back{border:0;background:var(--s2);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:20px}
main{max-width:1100px;margin:0 auto;padding:4px calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
@media(min-width:900px){nav{top:0;bottom:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;padding-top:88px}nav a{flex:none}body{padding-left:88px}main{padding-bottom:40px}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;gap:4px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:var(--s2)}
nav a{flex:0 1 120px;text-align:center;text-decoration:none;color:var(--mut);font-size:12px;font-weight:600;padding:6px 0;border-radius:20px}
nav a span{display:block;font-size:20px;margin:0 auto 2px;width:min(56px,100%);border-radius:16px;padding:2px 0}
nav a.on{color:var(--on)} nav a.on span{background:var(--ton)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--s1);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px} .sp{flex:1}
.badge{width:52px;height:52px;border-radius:18px;background:var(--ton);color:var(--onton);display:grid;place-items:center;font-size:26px;flex:none}
.t1{font-size:20px;font-weight:600} .t2{color:var(--mut);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--s2);color:var(--mut)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok)} .pill.bad i{background:var(--err)}
.btn{border:0;border-radius:20px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--pri);color:var(--onpri);transition:border-radius .2s}
.btn:active{border-radius:10px} .btn.ton{background:var(--ton);color:var(--onton)} .btn.out{background:transparent;border:1.5px solid var(--s3);color:var(--on)}
.btn.danger{background:var(--errc);color:var(--err)} .btn[disabled]{opacity:.5;cursor:default}
.chip{border:0;border-radius:12px;padding:8px 14px;background:var(--s2);font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri)}
input,select,textarea{width:100%;border:1.5px solid var(--s3);background:var(--s1);border-radius:16px;padding:14px 16px;outline:none;color:var(--on);font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--pri)} label{font-size:13px;font-weight:600;color:var(--mut)}
.list .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;cursor:pointer}
.list .item:hover{background:var(--s2)}
.empty{text-align:center;color:var(--mut);padding:56px 0}
/* remote */
.remote{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:22px;align-items:stretch}
.k{border:0;background:var(--s2);color:var(--on);border-radius:50%;width:64px;height:64px;font-size:24px;display:grid;place-items:center;cursor:pointer;
 transition:border-radius .18s cubic-bezier(.3,1.6,.5,1),transform .1s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.k:active{border-radius:20px;transform:scale(.96)} .k.pw{background:var(--pri);color:var(--onpri)} .k small{font-size:13px;font-weight:700}
.k.hid{opacity:.35}
.pair{display:flex;justify-content:space-between}
.dpad{position:relative;width:260px;height:260px;margin:0 auto;border-radius:50%;background:var(--s2)}
.dpad .d{position:absolute;border:0;background:transparent;color:var(--on);font-size:28px;width:80px;height:80px;border-radius:40px;cursor:pointer}
.dpad .d:active{background:var(--s3)} .dpad .u{left:90px;top:6px} .dpad .dn{left:90px;bottom:6px} .dpad .l{left:6px;top:90px} .dpad .r{right:6px;top:90px}
.dpad .okb{position:absolute;left:75px;top:75px;width:110px;height:110px;border-radius:50%;border:0;background:var(--ton);color:var(--onton);font-weight:700;font-size:18px;cursor:pointer;transition:border-radius .18s}
.dpad .okb:active{border-radius:32px}
.rock{display:flex;height:64px;border-radius:32px;background:var(--s2);overflow:hidden;flex:1}
.rock button{flex:1;border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--on)} .rock button:active{background:var(--s3)}
.swipe{position:relative;width:100%;height:100%;margin:0 auto;border-radius:40px;background:var(--s2);touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600;cursor:pointer}
.swipe span{position:absolute;opacity:.35;font-size:20px} .swipe span.on{opacity:1;color:var(--pri)}
.trio{display:flex;justify-content:space-between}
.rock .lbl{align-self:center;font-size:12px;font-weight:700;color:var(--mut);padding:0 4px}
.extras{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;justify-items:center}
.extras .cell{width:64px;height:64px;border-radius:50%;border:2px dashed transparent}
.extras .cell.drop{border-color:var(--pri)}
.ac{display:flex;flex-direction:column;gap:16px;align-items:center}
.ac .temp{font-size:64px;font-weight:700;letter-spacing:-2px}
/* menu & sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border-radius:28px 28px 0 0;width:min(560px,100%);padding:12px 8px calc(20px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h3{margin:10px 20px 2px} .sheet .url{margin:0 20px 8px;font:12px ui-monospace,monospace;color:var(--mut);word-break:break-all}
.sheet .item{display:flex;gap:16px;align-items:center;padding:14px 20px;border-radius:16px;cursor:pointer;font-weight:500}
.sheet .item:hover{background:var(--s2)}
.big{width:200px;height:200px;border-radius:100px;border:0;background:var(--pri);color:var(--onpri);font-size:84px;cursor:pointer;transition:border-radius .2s cubic-bezier(.3,1.6,.5,1);margin:0 auto;display:block}
.big:active{border-radius:44px}
.ex{font:13px ui-monospace,monospace;color:var(--mut);background:var(--s2);border-radius:12px;padding:10px 12px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,160px);background:var(--on);color:var(--bg);padding:14px 20px;border-radius:16px;font-weight:600;transition:transform .25s cubic-bezier(.2,1.4,.4,1);z-index:30;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
details summary{cursor:pointer;color:var(--mut);font-weight:600;padding:8px 4px}
</style>
</head>
<body>
<header><button class="back" id="back" hidden>←</button><h1 id="title">BeamBridge</h1><span id="status" class="pill"><i></i><b>…</b></span><div id="conn" aria-label="Connection"></div></header>
<main id="view"></main>
<nav>
  <a href="#/" data-tab="devices"><span>🎛️</span>Devices</a>
  <a href="#/scenes" data-tab="scenes"><span>✨</span>Scenes</a>
  <a href="#/add" data-tab="add"><span>＋</span>Add</a>
  <a href="#/finder" data-tab="finder"><span>🔎</span>Finder</a>
  <a href="#/ir" data-tab="ir"><span>⚡</span>API</a>
  <a href="#/history" data-tab="history"><span>🕘</span>History</a>
  <a href="#/settings" data-tab="settings"><span>⚙️</span>Settings</a>
</nav>
<div id="toast"></div>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s);
const ICON={tv:"📺",ac:"❄️",set_top_box:"📡",other:"🎛️"};
const KEY={OPTIONS:"⚙",POWER:"⏻",POWER_ON:"⏻",POWER_OFF:"⭘",VOL_UP:"＋",VOL_DOWN:"−",VOL_MUTE:"🔇",CH_UP:"⌃",CH_DOWN:"⌄",UP:"▲",DOWN:"▼",LEFT:"◀",RIGHT:"▶",
 OK:"OK",SELECT:"OK",BACK:"↩",EXIT:"✕",HOME:"⌂",TCL_HOME:"⌂",MENU:"☰",INFO:"ⓘ",SOURCE:"⇥",PLAY:"▶",PAUSE:"⏸",STOP:"■",REWIND:"⏪",FAST_FORWARD:"⏩",
 NEXT:"⏭",PREVIOUS:"⏮",RECORD:"⏺",GUIDE:"▤",SETTINGS:"⚙",RED:"🔴",GREEN:"🟢",YELLOW:"🟡",BLUE:"🔵",NETFLIX:"N",YOUTUBE:"▶︎",TEMP_UP:"＋",TEMP_DOWN:"−"};
const pretty=n=>n.replace(/_/g," ").toLowerCase().replace(/^./,c=>c.toUpperCase());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800)}
async function api(path,opts={}){
  const o={...opts};o.headers={"X-BeamBridge-Client":"web",...(o.headers||{})};if(o.body&&typeof o.body==="object"){o.body=JSON.stringify(o.body);o.headers["Content-Type"]="application/json"}
  const r=await fetch(path,o);const j=await r.json().catch(()=>({status:"error",error:r.statusText}));
  if(!r.ok||j.status==="error")throw new Error(j.error||r.statusText);return j}
const post=(p,b)=>api(p,{method:"POST",body:b||{}});
async function copy(t){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();document.execCommand("copy");a.remove()}toast("URL copied")}
function h(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild}
function sheet(title,url,items){
  const s=h(`<div class="scrim"><div class="sheet"><h3>${esc(title)}</h3>${url?`<div class="url">${esc(url)}</div>`:""}</div></div>`);
  items.forEach(([ic,label,fn])=>{const it=h(`<div class="item"><span>${ic}</span><span>${esc(label)}</span></div>`);it.onclick=()=>{s.remove();fn()};$(".sheet",s).append(it)});
  s.onclick=e=>{if(e.target===s)s.remove()};document.body.append(s)}
function longPress(el,onTap,onLong,selfOnly=false){let t,long=false;
  const start=e=>{if(selfOnly&&e.target!==el)return;long=false;t=setTimeout(()=>{long=true;navigator.vibrate?.(15);onLong()},480)};const end=()=>clearTimeout(t);
  el.addEventListener("pointerdown",start);el.addEventListener("pointerup",end);el.addEventListener("pointerleave",end);el.addEventListener("pointercancel",end);
  el.addEventListener("contextmenu",e=>{if(selfOnly&&e.target!==el)return;e.preventDefault();end();if(!long)onLong();long=true});
  el.addEventListener("click",e=>{if(long){e.preventDefault();return}onTap()})}

let devices=[];let current=null;
async function refreshStatus(){try{const s=await api("/api/status");$("#status").className="pill"+(s.ir_emitter?"":" bad");$("#status b").textContent=s.ir_emitter?"Online":"No IR emitter";
  const u=new URL(s.base_url||location.origin);$("#conn").replaceChildren(...[["IP",u.hostname],["Port",u.port||"80"],["Auth",s.auth==="password"?"🔒 password":"guest"],["Devices",s.devices]].map(([k,v])=>{const e=h(`<span title="Copy">${k} ${esc(v)}</span>`);e.onclick=()=>copy(String(v));return e}))}catch{$("#status").className="pill bad";$("#status b").textContent="Offline"}}
async function loadDevices(){devices=await api("/api/devices");return devices}
function press(id,btn,el){navigator.vibrate?.(8);el?.classList.add("sending");const fb=$("#fb");if(fb)fb.textContent=`Sending ${pretty(btn)}…`;
  api(`/api/blast?device=${encodeURIComponent(id)}&button=${encodeURIComponent(btn)}`,{method:"POST"})
   .then(()=>{el?.classList.add("sent");if(fb)fb.textContent=`✓ ${pretty(btn)} sent`},e=>{el?.classList.add("fail");if(fb)fb.textContent=`✕ ${e.message}`;toast(e.message)})
   .finally(()=>{el?.classList.remove("sending");setTimeout(()=>el?.classList.remove("sent","fail"),600)})}

/* ---------------- routes ---------------- */
const routes={"scenes":viewScenes,"scene":viewSceneEdit,"history":viewHistory,"":viewDevices,"device":viewDevice,"add":viewAdd,"finder":viewFinder,"ir":viewIr,"settings":viewSettings};
async function render(){
  const [,name="",arg]=location.hash.replace(/^#/,"").split("/");const v=$("#view");v.replaceChildren();document.onkeydown=null;if(name!=="device")editing=false;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.tab===(name===""||name==="device"?"devices":name==="scene"?"scenes":name)));
  $("#back").hidden=name!=="device";$("#back").onclick=()=>location.hash="#/";
  try{await (routes[name]||viewDevices)(v,arg&&decodeURIComponent(arg))}catch(e){v.append(h(`<div class="empty">${esc(e.message)}</div>`))}}
window.addEventListener("hashchange",render);

/* ---------------- history ---------------- */
async function viewHistory(v){
  $("#title").textContent="History";const list=await api("/api/history?limit=20");
  const top=h(`<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="t2">Last ${list.length} commands from the app, web, API and scenes</span><button class="btn out" id="clr">Clear</button></div>`);
  $("#clr",top).onclick=async()=>{if(confirm("Clear history?")){await api("/api/history",{method:"DELETE"});render()}};v.append(top);
  if(!list.length){v.append(h(`<div class="empty">Nothing sent yet</div>`));return}
  const c=h(`<section class="card col"></section>`);
  list.forEach(e=>c.append(h(`<div class="row" style="gap:12px;padding:6px 0"><span class="pill ${e.ok?"":"bad"}"><i></i>${e.ok?"Sent":"Failed"}</span><div class="sp"><div class="t1">${esc(pretty(e.button))}${e.device_name||e.device?` → ${esc(e.device_name||e.device)}`:""}</div><div class="t2">${new Date(e.time).toLocaleString()} · ${esc(e.source)}${e.message?` · ${esc(e.message)}`:""}</div></div></div>`)));
  v.append(c)}

/* ---------------- scenes ---------------- */
async function viewScenes(v){
  $("#title").textContent="Scenes";const list=await api("/api/scenes");
  const top=h(`<div class="row" style="justify-content:flex-end;margin-bottom:12px"><a class="btn" href="#/scene/new" style="text-decoration:none">＋ New scene</a></div>`);v.append(top);
  if(!list.length){v.append(h(`<div class="empty">A scene sends several commands in one go, e.g. TV power → wait 3 s → HDMI 1 → AC on.</div>`));return}
  const g=h(`<div class="col" style="gap:12px"></div>`);
  list.forEach(sc=>{const c=h(`<section class="card row" style="gap:12px"><div class="badge">✨</div><div class="sp"><div class="t1">${esc(sc.name)}</div><div class="t2">${sc.steps.length} steps</div></div><button class="btn out cp" title="Copy URL">🔗</button><button class="btn out ed">Edit</button><button class="btn run">▶ Run</button></section>`);
    $(".cp",c).onclick=()=>copy(sc.url);$(".ed",c).onclick=()=>location.hash=`#/scene/${enc(sc.id)}`;
    $(".run",c).onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.textContent="Running…";try{const r=await post(`/api/scenes/${enc(sc.id)}/run`);toast(r.failed?`${r.failed} step(s) failed`:`${sc.name} done`)}catch(err){toast(err.message)}b.disabled=false;b.textContent="▶ Run"};
    g.append(c)});v.append(g)}

async function viewSceneEdit(v,id){
  await loadDevices();const isNew=!id||id==="new";const sc=isNew?{name:"",steps:[]}:await api(`/api/scenes/${enc(id)}`);
  $("#title").textContent=isNew?"New scene":"Edit scene";$("#back").hidden=false;$("#back").onclick=()=>location.hash="#/scenes";
  const steps=sc.steps.map(s=>({...s}));const act=devices.filter(d=>!d.archived);
  const c=h(`<section class="card col" style="gap:12px"><label>Name<input id="nm" value="${esc(sc.name)}" placeholder="Movie night"></label><div id="st" class="col" style="gap:8px"></div>
    <div class="row" style="gap:8px"><button class="btn ton" id="addk">＋ Key press</button><button class="btn out" id="addw">⏱ Wait</button></div>
    <div class="row" style="gap:8px;justify-content:flex-end">${isNew?"":`<button class="btn out" id="del">Delete</button>`}<button class="btn" id="save">Save</button></div></section>`);
  const draw=()=>{const box=$("#st",c);box.replaceChildren();steps.forEach((s,i)=>{
    const row=h(`<div class="row" style="gap:8px"><b style="width:20px">${i+1}</b></div>`);
    if(s.wait!=null){const inp=h(`<input type="number" min="1" max="60000" value="${s.wait}" style="flex:1" aria-label="Wait milliseconds">`);inp.oninput=()=>s.wait=parseInt(inp.value,10);row.append(h(`<span>Wait</span>`),inp,h(`<span>ms</span>`))}
    else{const ds=h(`<select style="flex:1" aria-label="Device">${act.map(d=>`<option value="${esc(d.id)}" ${d.id===s.device?"selected":""}>${esc(d.name)}</option>`).join("")}</select>`);

function tileEl(d,t,L,B){

    longPress(el,()=>press(d.id,n,el),()=>buttonMenu(d,B[n]||{name:n}));return el};
  if(t.id==="@DPAD"){
    if(d.swipe)return swipePad(d,L);
    const dp=h(`<div class="dpad" role="group" aria-label="D-pad"></div>`);
    [["up","u","▲"],["down","dn","▼"],["left","l","◀"],["right","r","▶"]].forEach(([key,c,ic])=>{if(!L[key])return;const b=h(`<button class="d ${c}" aria-label="${key}">${ic}</button>`);longPress(b,()=>press(d.id,L[key],b),()=>buttonMenu(d,B[L[key]]||{name:L[key]}));dp.append(b)});
    if(L.ok){const b=h(`<button class="okb">OK</button>`);longPress(b,()=>press(d.id,L.ok,b),()=>buttonMenu(d,B[L.ok]||{name:L.ok}));dp.append(b)}return dp}

    const x=h(`<div class="rock" role="group" aria-label="${t.id==="@VOL"?"Volume":"Channel"}"><button aria-label="${t.id==="@VOL"?"Volume down":"Channel down"}">−</button><span class="lbl">${t.id==="@VOL"?"VOLUME":"CHANNEL"}</span><button aria-label="${t.id==="@VOL"?"Volume up":"Channel up"}">＋</button></div>`);const [m,p]=x.querySelectorAll("button");
    if(a)longPress(m,()=>press(d.id,a,m),()=>buttonMenu(d,B[a]||{name:a}));else m.disabled=true;if(b)longPress(p,()=>press(d.id,b,p),()=>buttonMenu(d,B[b]||{name:b}));else p.disabled=true;return x}

  if(t.w>1)el.innerHTML=`${KEY[t.id]?KEY[t.id]+" ":""}<small>${esc(pretty(t.id))}</small>`;return el}
function gridRemote(d,L,B){
  const G=d.grid,wrap=h(`<div class="g${editing?" edit":""}" style="--cols:${G.cols};--rows:${G.rows}"></div>`);
  if(editing)for(let i=0;i<G.cols*G.rows;i++)wrap.append(h(`<div class="cell" style="grid-column:${i%G.cols+1};grid-row:${Math.floor(i/G.cols)+1}"></div>`));
  else longPress(wrap,()=>{},()=>{editing=true;render()},true);
  G.tiles.forEach(t=>{const box=h(`<div class="tile" style="grid-column:${t.col+1} / span ${t.w};grid-row:${t.row+1} / span ${t.h}"></div>`);box.append(tileEl(d,t,L,B));
    if(editing){box.tabIndex=0;box.setAttribute("aria-label",`${pretty(t.id.replace("@",""))}, column ${t.col+1}, row ${t.row+1}, ${t.w} by ${t.h}`);
      box.append(h(`<span class="rz" aria-hidden="true">◢</span>`));editTile(d,wrap,box,t)}
    wrap.append(box)});
  return wrap}
function editTile(d,wrap,box,t){
  const save=async(c,r,w,hh)=>{try{await post(`/api/devices/${enc(d.id)}/tiles/${enc(t.id)}`,{col:c,row:r,w,h:hh})}catch(e){toast(e.message)}render()};
  const cell=()=>{const gap=10;return (wrap.clientWidth+gap)/d.grid.cols};
  let sx,sy,mode=null;
  box.onpointerdown=e=>{mode=e.target.classList.contains("rz")?"size":"move";sx=e.clientX;sy=e.clientY;box.setPointerCapture(e.pointerId);box.classList.add("drag");e.preventDefault()};
  box.onpointermove=e=>{if(!mode)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(mode==="move")box.style.transform=`translate(${dx}px,${dy}px) scale(1.04)`;
    else{const cw=cell();box.style.gridColumnEnd=`span ${Math.max(1,t.w+Math.round(dx/cw))}`;box.style.gridRowEnd=`span ${Math.max(1,t.h+Math.round(dy/cw))}`}};
  box.onpointerup=e=>{if(!mode)return;const cw=cell(),dc=Math.round((e.clientX-sx)/cw),dr=Math.round((e.clientY-sy)/cw),m=mode;mode=null;box.classList.remove("drag");box.style.transform="";
    if(m==="move"&&(dc||dr))save(t.col+dc,t.row+dr,t.w,t.h);else if(m==="size"&&(dc||dr))save(t.col,t.row,t.w+dc,t.h+dr)};
  box.onpointercancel=()=>{mode=null;box.style.transform="";box.classList.remove("drag")};
  box.onkeydown=e=>{const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!dir)return;e.preventDefault();
    if(e.shiftKey)save(t.col,t.row,t.w+dir[0],t.h+dir[1]);else save(t.col+dir[0],t.row+dir[1],t.w,t.h)};
}
function addKeys(d){sheet("Add keys to screen","",(d.layout.available||[]).map(n=>[KEY[n]||"＋",pretty(n),async()=>{await post(`/api/devices/${enc(d.id)}/buttons/${enc(n)}`,{onscreen:true});render()}]))}
function swipePad(d,L){
  const el=h(`<div class="swipe" title="Swipe for arrows, tap for OK"><span style="top:10px">▲</span><span style="bottom:10px">▼</span><span style="left:14px">◀</span><span style="right:14px">▶</span>Swipe · tap for OK</div>`);
  const [u,dn,l,r]=el.querySelectorAll("span"),arrow={[L.up]:u,[L.down]:dn,[L.left]:l,[L.right]:r};
  const send=n=>{if(!n)return;press(d.id,n,el);const a=arrow[n];if(a){a.classList.add("on");setTimeout(()=>a.classList.remove("on"),180)}};
  let sx,sy,moved=false;const STEP=48;
  el.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;moved=false;el.setPointerCapture(e.pointerId)};
  el.onpointermove=e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>=STEP||Math.abs(dy)>=STEP){moved=true;send(Math.abs(dx)>Math.abs(dy)?(dx>0?L.right:L.left):(dy>0?L.down:L.up));sx=e.clientX;sy=e.clientY}};
  el.onpointerup=()=>{if(sx!=null&&!moved)send(L.ok);sx=null};el.onpointercancel=()=>{sx=null};
  return el}

      if(!bs.length)list.append(h(`<div class="empty">Nothing found</div>`));bs.slice(0,300).forEach(b=>{const it=h(`<div class="item"><span class="sp">${esc(b.name)}</span><span class="t2">${b.remotes>1?b.remotes:""}</span></div>`);it.onclick=()=>{W.brand=b;W.step="power";render()};list.append(it)})};
    let t;$("#q",c).oninput=()=>{clearTimeout(t);t=setTimeout(load,200)};$("#bk",c).onclick=()=>{W.step="type";render()};v.append(c);load();return}
  if(W.step==="power"){const c=h(`<div class="card col" style="max-width:560px;margin:0 auto;align-items:center;text-align:center"><div class="t1">Is your ${esc(W.brand.name)} ${W.type==="ac"?"AC":W.type==="stb"?"box":"TV"} on right now?</div>
     <div class="row"><button class="btn ton" id="off">It's off</button><button class="btn" id="on">It's on</button></div><button class="btn out" id="bk">Back</button></div>`);
    const go=async on=>{W.on=on;W.cands=await api(`/api/catalog/candidates?type=${W.type}&brand=${W.brand.id}&on=${on}`);W.idx=0;if(!W.cands.length){toast("No usable codes for this brand");return}W.step="test";render()};
    $("#off",c).onclick=()=>go(false);$("#on",c).onclick=()=>go(true);$("#bk",c).onclick=()=>{W.step="brand";render()};v.append(c);return}
  if(W.step==="test"){const cand=W.cands[W.idx];const c=h(`<div class="card col" style="max-width:560px;margin:0 auto;align-items:center;text-align:center">
     <div class="t1">${esc(W.brand.name)}</div><div class="t2">Press, then watch the ${W.type==="ac"?"AC":"screen"} · sends ${esc(pretty(cand.test_key))}</div>
     <button class="big">${W.on?(W.type==="ac"?"🌡":"🔊"):"⏻"}</button><div class="pill">${W.idx+1} / ${W.cands.length}</div>
     <div class="row"><button class="btn" id="y">✓ Yes, it worked</button><button class="btn ton" id="n">Try Next Code ›</button></div><button class="btn out" id="bk">Back</button></div>`);
    $(".big",c).onclick=()=>post("/api/catalog/test",{type:W.type,brand:W.brand.id,index:cand.index,on:W.on}).then(()=>toast("Sent")).catch(e=>toast(e.message));
    $("#y",c).onclick=()=>{W.step="name";render()};$("#n",c).onclick=()=>{W.idx=(W.idx+1)%W.cands.length;render()};$("#bk",c).onclick=()=>{W.step="power";render()};v.append(c);return}
  if(W.step==="name"){const def=`${W.brand.name} ${W.type==="ac"?"AC":W.type==="stb"?"Box":"TV"}`;const c=h(`<div class="card col" style="max-width:560px;margin:0 auto"><label>Name<input id="n" value="${esc(def)}"></label><div class="row"><button class="btn out" id="bk">Back</button><span class="sp"></span><button class="btn" id="s">Save</button></div></div>`);
    $("#bk",c).onclick=()=>{W.step="test";render()};$("#s",c).onclick=async()=>{try{const d=await post("/api/devices",{type:W.type,brand:W.brand.id,brand_name:W.brand.name,index:W.cands[W.idx].index,name:$("#n",c).value});W.step="type";location.hash=`#/device/${enc(d.id)}`}catch(e){toast(e.message)}};v.append(c)}}

/* ---------------- finder ---------------- */
let finderPoll;
async function viewFinder(v,deviceId){
  $("#title").textContent="TV finder";clearInterval(finderPoll);await loadDevices();
  const [f,keys]=await Promise.all([api("/api/finder"),api("/api/finder/keys")]);
  const c=h(`<div class="col" style="max-width:600px;margin:0 auto"></div>`);v.append(c);
  const devSel=h(`<label>Device<select id="dev">${devices.map(d=>`<option value="${esc(d.id)}" ${d.id===deviceId?"selected":""}>${esc(d.name)}</option>`).join("")}<option value="__new">＋ New custom device…</option></select></label>`);
  if(!f.key||(!f.running&&!f.sent)){
    const card=h(`<div class="card col"></div>`);card.append(devSel);
    const kc=h(`<div><label>Button to find</label><div class="row" style="flex-wrap:wrap;margin-top:8px"></div></div>`);let key="POWER";
    keys.forEach(k=>{const b=h(`<button class="chip ${k===key?"on":""}">${KEY[k]||""} ${pretty(k)}</button>`);b.onclick=()=>{key=k;kc.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on")};$(".row",kc).append(b)});
    const go=h(`<button class="btn">Start finding</button>`);go.onclick=async()=>{let dev=$("#dev",card).value;
      if(dev==="__new"){const n=prompt("Name for the new device","My TV");if(!n)return;dev=(await post("/api/devices",{type:"tv",name:n})).id}
      sessionStorage.finderDevice=dev;await post("/api/finder/start",{key});render()};
    card.append(kc,go,h(`<p class="t2" style="margin:0">Point the phone at the TV. Every stored code for this button is sent, one by one. Tap Stop as soon as the TV reacts.</p>`));c.append(card);return}
  if(f.running){const card=h(`<div class="card col" style="align-items:center;text-align:center"><div class="t1">Sending ${esc(pretty(f.key))}…</div><div style="font-size:48px;font-weight:700">${f.sent} / ${f.total}</div>
     <div style="width:100%;height:10px;border-radius:5px;background:var(--s2);overflow:hidden"><div style="height:100%;width:${(100*f.sent/f.total).toFixed(1)}%;background:var(--pri);transition:width .3s"></div></div>
     <button class="big" style="background:var(--err);color:var(--bg);font-size:44px">STOP</button></div>`);$(".big",card).onclick=async()=>{await post("/api/finder/stop");render()};c.append(card);
    finderPoll=setInterval(async()=>{const s=await api("/api/finder").catch(()=>null);if(!s||!s.running||location.hash.indexOf("#/finder")!==0){clearInterval(finderPoll);if(location.hash.indexOf("#/finder")===0)render();return}
      card.querySelector("div[style*='48px']").textContent=`${s.sent} / ${s.total}`;card.querySelector("div[style*='transition']").style.width=`${(100*s.sent/s.total).toFixed(1)}%`},500);return}
  const dev=sessionStorage.finderDevice||deviceId||devices[0]?.id;
  const card=h(`<div class="card col"><div class="t1">Which one made the TV react?</div><div class="t2">Codes ${f.window.length?`${f.window[f.window.length-1].index+1}–${f.window[0].index+1}`:""} of ${f.total} · ${esc(pretty(f.key))}</div><div class="list"></div>
    <div class="row" style="flex-wrap:wrap"><button class="btn out" id="older">‹ 5 earlier</button><button class="btn out" id="newer">5 later ›</button><span class="sp"></span><button class="btn ton" id="resume">Keep searching</button><button class="btn out" id="cancel">Cancel</button></div></div>`);
  f.window.forEach(w=>{const it=h(`<div class="item"><button class="k" style="width:48px;height:48px;font-size:18px">▶</button><span class="sp">#${w.index+1} · ${esc(w.label)}</span><button class="btn">Use</button></div>`);
    $(".k",it).onclick=e=>{e.stopPropagation();post("/api/finder/test",{index:w.index}).then(()=>toast("Sent")).catch(x=>toast(x.message))};
    $(".btn",it).onclick=async e=>{e.stopPropagation();if(!dev){toast("Pick a device first");return}const name=prompt("Button name",f.key);if(name===null)return;
      await post("/api/finder/accept",{device:dev,index:w.index,name});toast("Saved");location.hash=`#/finder/${enc(dev)}`;render()};$(".list",card).append(it)});
  $("#older",card).disabled=(f.page+1)*5>=f.sent;$("#newer",card).disabled=f.page===0;
  $("#older",card).onclick=async()=>{await post("/api/finder/page",{page:f.page+1});render()};$("#newer",card).onclick=async()=>{await post("/api/finder/page",{page:f.page-1});render()};
  $("#resume",card).onclick=async()=>{await post("/api/finder/resume");render()};$("#cancel",card).onclick=async()=>{await post("/api/finder/reset");render()};
  if(f.done)card.prepend(h(`<div class="pill bad"><i></i>All ${f.total} codes tried</div>`));c.append(card)}

/* ---------------- custom IR ---------------- */
async function viewIr(v){
  $("#title").textContent="API & raw IR";await loadDevices();const st=await api("/api/status").catch(()=>({}));const base=st.base_url||location.origin;
  // API playground: pick a device + key (or scene), get ready-to-copy requests
  const scenes=await api("/api/scenes").catch(()=>[]);
  const pg=h(`<section class="card col" style="max-width:600px;margin:0 auto 16px"><div class="t1">API playground</div>
    <div class="row" style="flex-wrap:wrap"><label class="sp">Device<select id="pd">${devices.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join("")}${scenes.length?`<option value="@scene">— Scenes —</option>`:""}</select></label><label class="sp">Key<select id="pb"></select></label></div>
    <label>Format<select id="pf"><option value="url">URL (GET)</option><option value="curl">curl (POST)</option><option value="ha">Home Assistant rest_command</option><option value="js">JavaScript fetch</option></select></label>
    <pre class="code" id="out" tabindex="0"></pre><div class="row" style="justify-content:flex-end"><button class="btn out" id="cp">Copy</button><button class="btn" id="try">Try it</button></div></section>`);
  const pd=$("#pd",pg),pb=$("#pb",pg),pf=$("#pf",pg),out=$("#out",pg);
  const auth=st.auth==="password";
  const target=()=>pd.value==="@scene"?{url:`${base}/api/scenes/${enc(pb.value)}/run`,name:pb.value}:{url:`${base}/api/blast?device=${enc(pd.value)}&button=${enc(pb.value)}`,name:`${pd.value}_${pb.value}`.toLowerCase()};
  const fill=()=>{if(pd.value==="@scene")pb.innerHTML=scenes.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");else{const d=devices.find(x=>x.id===pd.value);pb.innerHTML=(d?.buttons||[]).map(b=>`<option>${esc(b.name)}</option>`).join("")}gen()};
  const gen=()=>{if(!pb.value){out.textContent="Add a device first";return}const t=target();const a=auth?" -u USER:PASSWORD":"";
    out.textContent={url:t.url+(auth?"\n\n(Password mode: use http://USER:PASSWORD@host… or a Basic auth header)":""),
      curl:`curl -X POST${a} "${t.url}"`,
      ha:`rest_command:\n  ${t.name.replace(/[^a-z0-9_]/g,"_")}:\n    url: "${t.url}"\n    method: POST${auth?"\n    username: USER\n    password: PASSWORD":""}`,
      js:`await fetch("${t.url}", { method: "POST"${auth?`, headers: { Authorization: "Basic " + btoa("USER:PASSWORD") }`:""} });`}[pf.value]};
  pd.onchange=fill;pb.onchange=gen;pf.onchange=gen;$("#cp",pg).onclick=()=>copy(out.textContent);
  $("#try",pg).onclick=async()=>{try{const r=await post(target().url.replace(base,""));toast(r.status==="ok"?"✓ Sent":`Status: ${r.status}`)}catch(e){toast(e.message)}};
  fill();v.append(pg);
  const c=h(`<div class="card col" style="max-width:600px;margin:0 auto"><label>IR code<textarea id="ir" rows="4" placeholder="NEC 0x20DF10EF 32"></textarea></label><div class="ex">${esc(EXAMPLES).replace(/\n/g,"<br>")}</div>
    <button class="btn" id="send">⚡ Send</button><details><summary>Save as a button</summary><div class="col" style="margin-top:8px">
    <label>Device<select id="dev">${devices.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join("")}</select></label><label>Button name<input id="bn" placeholder="e.g. Input"></label><button class="btn ton" id="save">Save button</button></div></details></div>`);
  $("#send",c).onclick=()=>post("/api/raw",{ir:$("#ir",c).value}).then(r=>toast(`Sent · ${r.pulses} pulses @ ${r.frequency} Hz`)).catch(e=>toast(e.message));
  $("#save",c).onclick=async()=>{try{await post(`/api/devices/${enc($("#dev",c).value)}/buttons`,{name:$("#bn",c).value,ir:$("#ir",c).value});toast("Saved")}catch(e){toast(e.message)}};v.append(c)}

/* ---------------- settings ---------------- */
async function viewSettings(v){
  $("#title").textContent="Settings";const [s,net]=await Promise.all([api("/api/settings"),api("/api/network")]);
  const c=h(`<div class="card col" style="max-width:600px;margin:0 auto">
   <div class="t1">Web access</div><div class="row"><button class="chip ${s.auth==="guest"?"on":""}" data-auth="guest">Open (guest)</button><button class="chip ${s.auth==="password"?"on":""}" data-auth="password">Username + password</button></div>
   <div id="cred" class="col" ${s.auth==="password"?"":"hidden"}><label>Username<input id="u" value="${esc(s.username)}" autocomplete="username"></label><label>Password<input id="p" type="password" placeholder="${s.has_password?"unchanged":"at least 4 characters"}" autocomplete="new-password"></label></div>
   <div class="t1" style="margin-top:8px">Address</div><label>Listen on<select id="a">${net.options.map(o=>`<option value="${esc(o.address)}" ${o.address===s.bind_address?"selected":""}>${esc(o.label)}${/^\d/.test(o.address)&&o.address!=="0.0.0.0"?" · "+o.address:""}</option>`).join("")}</select></label>
   <label>Port<input id="port" type="number" min="1024" max="65535" value="${s.port}"></label><div class="row"><button class="btn out" id="chk">Check availability</button><span id="res" class="t2"></span></div>
   <div class="t1" style="margin-top:8px">Power</div>
   <label class="row"><input type="checkbox" id="wl" style="width:auto" ${s.wake_lock?"checked":""}> Keep CPU awake while serving</label>
   <label class="row"><input type="checkbox" id="as" style="width:auto" ${s.auto_start?"checked":""}> Start server when the app opens</label>
   <button class="btn" id="save">Save</button></div>`);
  let auth=s.auth;c.querySelectorAll("[data-auth]").forEach(b=>b.onclick=()=>{auth=b.dataset.auth;c.querySelectorAll("[data-auth]").forEach(x=>x.classList.toggle("on",x===b));$("#cred",c).hidden=auth!=="password"});
  $("#chk",c).onclick=async()=>{try{const r=await api(`/api/network/check?address=${enc($("#a",c).value)}&port=${$("#port",c).value}`);$("#res",c).textContent=!r.present?"Address not on this phone":r.available?`✓ Free · ${r.url}`:"✗ Port in use"}catch(e){$("#res",c).textContent=e.message}};
  $("#save",c).onclick=async()=>{try{const body={auth,username:$("#u",c).value,bind_address:$("#a",c).value,port:+$("#port",c).value,wake_lock:$("#wl",c).checked,auto_start:$("#as",c).checked};
    if($("#p",c).value)body.password=$("#p",c).value;await post("/api/settings",body);toast("Saved");
    if(+body.port!==s.port||body.bind_address!==s.bind_address)toast("Server moved, open the new address")}catch(e){toast(e.message)}};v.append(c)}

refreshStatus();setInterval(refreshStatus,30000);render();
</script>
</body>
